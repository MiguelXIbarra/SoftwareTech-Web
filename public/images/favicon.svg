<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente oficial de la marca: Violeta Neón -> Cian Eléctrico Ultra-brillante -->
    <linearGradient id="stBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="25%" stop-color="#a855f7" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Gradiente de alta luminosidad para el texto central ST -->
    <linearGradient id="stTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Resplandor neón sutil para resaltar sobre cualquier color de pestaña -->
    <filter id="stGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Marco de corchete abierto de Software Technologies (Sin fondo, trazo ancho y visible) -->
  <path d="M 8 32 L 8 8 L 56 8 L 56 56 L 30 56" 
        fill="none" 
        stroke="url(#stBrandGrad)" 
        stroke-width="5.5" 
        stroke-linecap="square" 
        stroke-linejoin="miter"
        filter="url(#stGlow)" />

  <!-- Tipografía del Isotipo ST (Más ancha, negrita y con máxima definición) -->
  <text x="32" y="40.5" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="0.5" 
        text-anchor="middle" 
        fill="url(#stTextGrad)">ST</text>
</svg>
